<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMid meet" role="img" aria-label="mcp-shield">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <g transform="translate(140, 100)">
    <path d="M60 0 L120 22 L120 70 Q120 105 60 120 Q0 105 0 70 L0 22 Z"
          fill="none" stroke="url(#accent)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M35 60 L52 78 L88 38"
          fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="600" y="160" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="84" font-weight="700" fill="#f8fafc" letter-spacing="-2">mcp-shield</text>

  <text x="600" y="206" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="26" font-weight="400" fill="#94a3b8">Security primitives for MCP servers.</text>

  <text x="600" y="250" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="15" fill="#60a5fa" letter-spacing="3">RBAC · RLS · REWRITE · REDACT · AUDIT</text>
</svg>
